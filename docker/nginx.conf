worker_processes auto;
pid /tmp/teamassistant-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    client_body_temp_path /tmp/teamassistant-client-body;
    proxy_temp_path /tmp/teamassistant-proxy;
    fastcgi_temp_path /tmp/teamassistant-fastcgi;
    uwsgi_temp_path /tmp/teamassistant-uwsgi;
    scgi_temp_path /tmp/teamassistant-scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    server {
        listen 8080;
        root /app/frontend;
        index index.html;

        location = /api/v2 {
            return 308 /api/v2/;
        }

        location ^~ /api/v2/ {
            proxy_pass http://127.0.0.1:23219;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
