services:
  teamassistant:
    image: ${TEAMASSISTANT_IMAGE:-ghcr.io/xunx-ii/teamassistant:latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TEAMASSISTANT_HTTP_PORT:-8080}:8080"
    volumes:
      - teamassistant-data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  teamassistant-data:
